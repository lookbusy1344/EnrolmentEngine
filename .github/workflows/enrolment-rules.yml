name: EnrolmentRules CI

# Build, verify formatting and run the full test suite (.NET + ClientApp unit
# tests + Playwright e2e) whenever the EnrolmentRules solution changes.
# Mirrors scripts/all-test.sh.
on:
  push:
    paths:
      - 'EnrolmentRules/**'
      - '.github/workflows/enrolment-rules.yml'
  pull_request:
    paths:
      - 'EnrolmentRules/**'
      - '.github/workflows/enrolment-rules.yml'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOLUTION: EnrolmentRules/EnrolmentRules.slnx
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-test:
    name: Build, format & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'EnrolmentRules/src/EnrolmentRules.Web/ClientApp/package.json'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'EnrolmentRules/src/EnrolmentRules.Web/ClientApp/pnpm-lock.yaml'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install ClientApp dependencies
        working-directory: EnrolmentRules/src/EnrolmentRules.Web/ClientApp
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: EnrolmentRules/src/EnrolmentRules.Web/ClientApp
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify formatting
        run: dotnet format "$SOLUTION" --verify-no-changes

      - name: Run full test suite
        run: ./EnrolmentRules/scripts/all-test.sh
