# Elite auxiliary policy — per-subject entry + rating tiers for the fourteen offered A-levels (Biology,
# Chemistry, Economics, English Language, English Literature, French, Further Mathematics, Geography,
# History, Mathematics, Physics, Politics, Psychology, Religious Studies — standing in for "Philosophy &
# Theology", see data/catalogue.yaml). Tier shape is deliberately different from Standard's: published
# Elite minimums are hard availability rules, so
#   green  = the hard Elite entry clause AND the configured advisory prediction/DfE-evidence clause;
#   amber  = the hard Elite entry clause alone;
#   red    = unconditional catch-all.
# A student who meets the published entry grade is therefore never red merely because prediction/DfE
# evidence is weak — evidence only ever promotes amber to green, never demotes entry-met to red. Every
# standard subject's entry clause is grade 8 in its cognate GCSE (facts.StandardEntry) except:
#   - Further Mathematics: grade 9 in GCSE Mathematics (facts.ExceptionalEntry), plus a chosen-Mathematics
#     prerequisite declared in data/catalogue.yaml (this policy) — not expressible inside a per-subject
#     rating rule, since the engine cannot see ChosenALevels (§ constraint pass is host code).
#   - Economics: no cognate GCSE exists in the shared GCSE vocabulary, so its configured related
#     discipline is GCSE Mathematics at facts.StandardEntry (mirrors the Standard policy's own Economics
#     tier, which already gates on GCSE Maths for the same reason).
#   - Religious Studies ("Philosophy & Theology"): no cognate GCSE exists either; its configured related
#     discipline is GCSE History at facts.StandardEntry (the closest essay-based humanities GCSE already
#     offered).
#   - Every other subject (English Language, English Literature, French, Geography, History, Mathematics,
#     Physics, Politics, Psychology): its own cognate GCSE only; no configured related discipline.
WorkflowName: 'subject-ratings'
Rules:
  - RuleName: 'biology:green'
    SuccessEvent: 'Entry met (GCSE Biology at grade 8 or above); predicted A-level grade at or above the green threshold'
    Expression: >-
      facts.Gcse("biology") >= facts.StandardEntry && facts.Predicted("biology") >= ALevelGrade.D && facts.DfeProbabilityAtOrAbove("biology", ALevelGrade.D) >= facts.MinDfeGreenProbabilityAtOrAbove
  - RuleName: 'biology:amber'
    SuccessEvent: 'Entry met (GCSE Biology at grade 8 or above)'
    Expression: >-
      facts.Gcse("biology") >= facts.StandardEntry
  - RuleName: 'biology:red'
    SuccessEvent: 'Entry requirement unmet (GCSE Biology below grade 8)'
    Expression: >-
      true
  - RuleName: 'chemistry:green'
